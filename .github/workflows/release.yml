name: Release

# A release is a deliberate act: push a version tag (for example v0.1.0, matching the version
# in app/src-tauri/tauri.conf.json) and this builds every platform and attaches the installers,
# the signed update files and latest.json to a DRAFT release. Review it, paste in the release
# notes, then publish; the in-app updater only sees published, non-prerelease releases.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: ''
          - platform: ubuntu-latest
            args: ''
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: install Linux dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev pkg-config

      - name: setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: install frontend dependencies
        run: npm ci
        working-directory: app

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update files so the in-app updater only accepts genuine updates. The
          # matching public key is in tauri.conf.json. Keep a backup of the private key.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          tagName: v__VERSION__
          releaseName: 'Endless Sky Mod Manager v__VERSION__'
          releaseBody: 'See the assets below for your platform. The installers are not code-signed yet: Windows SmartScreen / macOS Gatekeeper will warn on first launch, which is expected at this stage. (Replace this text with the release notes before publishing.)'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
