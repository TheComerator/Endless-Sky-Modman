name: Tests

# Runs on every push to main and on every pull request. It never publishes anything; releases
# are made only by release.yml, when a version tag is pushed.
on:
  push:
    branches:
      - main
  pull_request:

# A newer push to the same branch makes an older, still-running check pointless.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    # The full suite. Linux is the only place the app crate's own tests (the "shell" tests) can
    # run, because on Windows their test program lacks the manifest the real app gets.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev pkg-config

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: install frontend dependencies
        run: npm ci
        working-directory: app

      - name: formatting
        run: cargo fmt --check

      - name: lint
        run: cargo clippy --all-targets

      # `cargo test` also regenerates the TypeScript types in app/src/bindings.
      - name: Rust tests (core and app)
        run: cargo test --workspace

      - name: generated types match what is committed
        run: git diff --exit-code -- app/src/bindings

      - name: frontend build and tests
        run: |
          npm run build
          npm test
        working-directory: app

  windows:
    # The core logic on Windows, where most users are, to catch path and file-handling differences.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: core tests
        run: cargo test -p esmm-core
