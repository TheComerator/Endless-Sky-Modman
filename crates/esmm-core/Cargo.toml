[package]
name = "esmm-core"
version = "0.1.0"
edition.workspace = true
description = "Core logic for the Endless Sky mod manager: catalog, DataNode format, plugin metadata and state."

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tempfile = "3.27.0"
thiserror = "2.0.21"
ureq = "3.4.2"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
